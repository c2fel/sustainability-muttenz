# Manuell erfasste Tarife – Gemeinde Muttenz
# Bruttopreise in CHF inkl. MWST, Modell AD HOC: ohne Abo, ohne Konto/App
# (Kreditkarte, TWINT, QR-Code oder Terminal an der Station). Hat ein Betreiber
# mehrere Preismodelle, gilt immer das Ad-hoc-Modell.
#
# Erstbefüllung 2026-11-06 per Webscraping/Recherche der Betreiber-Websites.
# Jeder Eintrag trägt verified = false, bis er vor Ort oder in der App bestätigt ist:
# dann verified = true setzen (Preis ggf. korrigieren).
#
# - Ein [[manual_tariff]]-Eintrag gilt ab valid_from für alle evse_ids des Eintrags.
# - Preisänderung: Eintrag kopieren, neues valid_from und neue Preise eintragen, den alten
#   Eintrag stehen lassen. So entsteht der Preisverlauf für die Vorher/Nachher-Auswertung.
# - Einträge ohne valid_from oder ohne Preisfeld gelten als "offen" und werden ignoriert.
# - Ein manueller Tarif hat Vorrang vor einem Tarif aus der BFE-API.
#
# Felder:
#   energy_chf_kwh      Preis pro kWh
#   time_chf_h          Zeitpreis pro Stunde ab Minute 0 (Anschlussdauer)
#   blocking_chf_h      Zeitpreis pro Stunde ab blocking_after_min (ersetzt time_chf_h)
#   blocking_after_min  Minuten ohne Blockiergebühr
#   blocking_start/_end Blockiergebühr nur in diesem Zeitfenster, z.B. "08:00"/"20:00"
#   flat_chf            Start-/Sessionsgebühr pro Ladevorgang
#   source, url         Quelle (Text) und Link
#   confidence          hoch | mittel | tief – wie gut belegt ist der Preis für genau diese Station
#   verified            true, sobald der Preis an der Station / in der App bestätigt ist
#   note                Begründung, Annahmen, was zu prüfen ist
#   watch               Verknüpfung mit dem Preis-Watcher, z.B. { energy_chf_kwh = "migrol:lt22" }
#                       -> python -m ladestatistik -c config.toml tariff-check
#
# Neue Stationen ergänzen:
#   python -m ladestatistik -c config.toml tariff-template --out tarife.toml


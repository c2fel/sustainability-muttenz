# Ladestatistik Muttenz – Konfiguration
# Kopieren nach config.toml und anpassen. Relative Pfade gelten ab diesem File.

[site]
name = "Bahnhofstrasse 48, Muttenz"
address = "Bahnhofstrasse 48, 4132 Muttenz"
# amtliche Gebäudeadresse (swisstopo), WGS84
lat = 47.531982
lon = 7.649472

[scope]
# Aufgezeichnet werden alle Ladepunkte innerhalb der Gemeindegrenze (swisstopo).
municipality = "Muttenz"        # Fallback, falls swisstopo nicht erreichbar ist
record_municipality = true
# Optional zusätzlich ein Umkreis in km (0 = aus, nur Gemeinde).
record_radius_km = 0
# "Nahbereich": Detailauswertung pro Standort (Steckbrief, Heatmap, 7-Tage-Verlauf).
focus_radius_m = 800
# Zusätzliche Nahbereichs-Ladepunkte unabhängig von der Distanz:
focus_evse_ids = [
  # "CH*IWB*E55311", "CH*IWB*E55312",   # IWB Hauptstrasse 2 (1.06 km)
]
exclude_evse_ids = []

[collector]
db_path = "data/ladestatistik.sqlite"
cache_dir = "data/cache"
ocpi_delta_interval_s = 60      # Statusänderungen (ganze Schweiz, wenige kB)
ocpi_full_interval_s = 900      # Vollabzug als Absicherung (~600 kB)
oicp_enabled = true             # CPOs ohne OCPI (MOVE, eCarUp, Migros, Shell, AVIA …)
oicp_interval_s = 120           # ~180 kB gzip pro Abruf
catalog_interval_s = 21600      # Standorte + Tarife alle 6 h
max_gap_s = 600                 # längere Lücken = "nicht beobachtet"
flush_interval_s = 300          # Intervall-Verlängerungen gesammelt schreiben (SD-Karte)

[analysis]
# "session": Zeitgebühr (TIME) gilt für die ganze Anschlussdauer (CH-Praxis)
# "charging": nur während des Ladens (OCPI-Spezifikation)
time_mode = "session"
min_session_s = 300             # kürzere Belegungen = Rauschen
merge_gap_s = 180               # Unterbrüche < 3 min = gleicher Ladevorgang
timeline_days = 7               # Verlauf im Nahbereich

# Referenz-Ladevorgänge für den Preisvergleich (weekday: 0 = Montag)
[[analysis.reference_session]]
id = "kurz"
label = "Einkauf: Sa 10:00, 1 h, 10 kWh"
weekday = 5
start = "10:00"
duration_min = 60
energy_kwh = 10
max_power_kw = 11

[[analysis.reference_session]]
id = "pendler"
label = "Pendler: Di 07:00, 9 h, 25 kWh"
weekday = 1
start = "07:00"
duration_min = 540
energy_kwh = 25
max_power_kw = 11

[[analysis.reference_session]]
id = "nacht"
label = "Anwohner: Mi 19:00, 12 h, 30 kWh"
weekday = 2
start = "19:00"
duration_min = 720
energy_kwh = 30
max_power_kw = 11

[[analysis.reference_session]]
id = "schnell"
label = "Schnellladen: Do 14:00, 30 min, 25 kWh"
weekday = 3
start = "14:00"
duration_min = 30
energy_kwh = 25
max_power_kw = 150

[tariffs]
# Manuell erfasste Tarife für Ladepunkte ohne Tarif in der BFE-API (versioniert im Repo).
# Format und Felder: siehe Kopf von tarife.toml.
manual_file = "tarife.toml"

[publish]
# Web-Root für stats.jumut.ch; der Report liegt unter <out_dir>/<report_path>/
out_dir = "site"
report_path = "reports/charging"
base_url = "https://stats.jumut.ch"
title = "Ladestatistik Muttenz"
# Suchmaschinen fernhalten (robots.txt + noindex), bis die Publikation geklärt ist
allow_indexing = false

# Beispiel für einen lokal verwalteten Tunnel (/etc/cloudflared/config.yml).
# Der bestehende Tunnel für charging.jumut.ch (EVCC) bekommt einfach einen
# zweiten Hostnamen – es braucht keinen neuen Tunnel.
#
# Wird der Tunnel im Cloudflare-Dashboard verwaltet (Zero Trust → Networks →
# Tunnels → <Tunnel> → Public Hostname → Add), dieselben Werte dort eintragen.
# Beim Home-Assistant-Add-on "Cloudflared" stattdessen unter
# "additional_hosts" eintragen (siehe docs/deployment.md).

tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # bestehend: EVCC (durch Cloudflare Access geschützt)
  - hostname: charging.jumut.ch
    service: http://localhost:7070
  # neu: Ladestatistik-Dashboard (statische Dateien)
  - hostname: ladestatistik.jumut.ch
    service: http://localhost:8099
  - service: http_status:404
